; ESP32 Weather Dashboard
; https://docs.platformio.org/page/projectconf.html

[platformio]
description  = Weather dashboard for ESP32 + 480x320 SPI display, powered by Open-Meteo
default_envs = cyd35

[env]
platform      = espressif32@6.9.0
framework     = arduino
board         = esp32dev
board_build.partitions = huge_app.csv
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600
lib_deps =
  lovyan03/LovyanGFX@1.2.36
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -O2
  -Wall
  -D CORE_DEBUG_LEVEL=0

; ESP32-3248S035 "Cheap Yellow Display", 3.5" ST7796 (recommended)
[env:cyd35]
build_flags = ${env.build_flags} -D BOARD_ESP32_3248S035

; ESP32 DevKit + external 3.5" ST7796 SPI module (wiring: docs/hardware.md)
[env:devkit-st7796]
build_flags = ${env.build_flags} -D BOARD_DEVKIT_SPI -D PANEL_ST7796

; ESP32 DevKit + external 3.5" ILI9488 SPI module (wiring: docs/hardware.md)
[env:devkit-ili9488]
build_flags = ${env.build_flags} -D BOARD_DEVKIT_SPI -D PANEL_ILI9488
